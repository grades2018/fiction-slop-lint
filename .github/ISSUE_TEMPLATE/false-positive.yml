name: False positive
description: A rule flagged text that is fine. These reports are the most useful kind.
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule id
      description: For example llm-testament-to. Shown in every report line.
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: The text that was flagged
      description: Please paste only a short excerpt you have the right to share.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it fine here?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of fiction-slop-lint --version, or "web demo".
